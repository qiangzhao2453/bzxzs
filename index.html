<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的AI智能体</title>
    <style>
        /* === 页面样式：干净、居中、卡片 === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
            overflow: hidden;
        }
        #coze-chat-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="coze-chat-container"></div>
    </div>

    <!-- ======================================== -->
    <!-- 1. 加载 Coze Chat SDK（必须！）          -->
    <!-- ======================================== -->
    <script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.15/libs/cn/index.js">
    </script>

    <!-- ======================================== -->
    <!-- 2. 初始化你的智能体（核心配置）          -->
    <!-- ======================================== -->
    <script>
        // ⚠️ 请将下面两个值替换成你自己的！
        const BOT_ID = '7657853798601654298';          // 从 Coze 智能体 URL 中获取
        const ACCESS_TOKEN = 'pat_s3UYM4JFyow1BOKagxOP4LGpYAt8mMILCrHdfWrna48e8iyfHpzFb8mHbffGHftu'; // 从 Coze API 管理中生成

        new CozeWebSDK.WebChatClient({
            config: {
                bot_id: BOT_ID,
            },
            auth: {
                type: 'token',
                token: ACCESS_TOKEN,
                // 这个函数用于刷新令牌，直接返回当前令牌即可
                onRefreshToken: async () => ACCESS_TOKEN,
            },
            ui: {
                // 将聊天窗口挂载到页面中的容器里
                container: document.getElementById('coze-chat-container'),
            }
        });
    </script>
</body>
</html>
